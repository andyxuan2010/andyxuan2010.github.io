<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Azure landing zone governance hierarchy</title>
  <desc id="desc">A CCoE lab hierarchy sits below the tenant root and separates platform, landing zones with corporate and online branches, and sandbox governance.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 19px Arial,sans-serif;fill:#15253d}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="620" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Azure landing zone governance hierarchy</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Separate shared platform services, workload boundaries, and sandbox controls</text>
  <rect x="625" y="125" width="350" height="72" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="800" y="169" text-anchor="middle" class="node-title">Tenant Root</text>
  <rect x="625" y="235" width="350" height="72" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="800" y="279" text-anchor="middle" class="node-title">CCoE Lab</text>
  <path d="M800 197 V225" stroke="#52667f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 307 V355 M800 355 H300 V405 M800 355 H800 V405 M800 355 H1300 V405" fill="none" stroke="#52667f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="140" y="405" width="320" height="100" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="300" y="447" text-anchor="middle" class="node-title">Platform</text><text x="300" y="474" text-anchor="middle" class="node-text">Shared connectivity, identity, security</text>
  <rect x="640" y="405" width="320" height="100" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="800" y="447" text-anchor="middle" class="node-title">Landing Zones</text><text x="800" y="474" text-anchor="middle" class="node-text">Corporate and online workloads</text>
  <rect x="1140" y="405" width="320" height="100" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1300" y="447" text-anchor="middle" class="node-title">Sandbox</text><text x="1300" y="474" text-anchor="middle" class="node-text">Lighter policy, same identity and cost controls</text>
  <rect x="675" y="535" width="250" height="48" rx="24" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="566" text-anchor="middle" class="label">Corp · Online</text>
</svg>
