<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid network connectivity architecture with ExpressRoute, VPN Gateway, and Virtual WAN</title>
  <desc id="desc">Critical enterprise traffic uses ExpressRoute as the primary private path into Azure. A separate site-to-site VPN over the public internet provides failover and connectivity for sites outside the private WAN. Virtual WAN provides managed hubs and routing for branches, remote users, and multiple virtual networks. Azure Firewall, private DNS, monitoring, and workload identity govern the connectivity plane. The architecture provides network reachability but no application integration logic.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker>
    <marker id="primary-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2e8b57"/></marker>
    <marker id="backup-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#d06b2b"/></marker>
    <marker id="control-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7654c5"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#15253d}
      .subtitle{font:400 17px Arial,sans-serif;fill:#52667f}
      .boundary-title{font:700 21px Arial,sans-serif;fill:#15253d}
      .node-title{font:700 18px Arial,sans-serif;fill:#15253d}
      .node-text{font:400 15px Arial,sans-serif;fill:#52667f}
      .label{font:700 14px Arial,sans-serif;fill:#52667f}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f7f9fc"/>
  <text x="900" y="48" text-anchor="middle" class="title">Hybrid network connectivity for Azure</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">ExpressRoute primary path · separate VPN backup · Virtual WAN managed transit</text>

  <rect x="45" y="112" width="350" height="82" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="220" y="147" text-anchor="middle" class="node-title">Network operations and IaC</text>
  <text x="220" y="173" text-anchor="middle" class="node-text">IPAM, route policy, devices, providers, and change</text>
  <rect x="425" y="112" width="350" height="82" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="600" y="147" text-anchor="middle" class="node-title">Identity and security controls</text>
  <text x="600" y="173" text-anchor="middle" class="node-text">RBAC, certificates, keys, firewall, and authorization</text>
  <rect x="805" y="112" width="350" height="82" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="980" y="147" text-anchor="middle" class="node-title">Azure Monitor and synthetic probes</text>
  <text x="980" y="173" text-anchor="middle" class="node-text">BGP, tunnels, routes, latency, loss, and failover</text>
  <rect x="1185" y="112" width="570" height="82" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1470" y="147" text-anchor="middle" class="node-title">Hybrid DNS and address management</text>
  <text x="1470" y="173" text-anchor="middle" class="node-text">Non-overlapping prefixes, private zones, forwarding, and recovery</text>

  <text x="45" y="238" class="boundary-title">Enterprise networks and users</text>
  <rect x="45" y="260" width="275" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="182" y="296" text-anchor="middle" class="node-title">Critical data centres</text>
  <text x="182" y="322" text-anchor="middle" class="node-text">WAN, private circuits, and tier 0 or 1 systems</text>
  <rect x="45" y="382" width="275" height="92" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="182" y="418" text-anchor="middle" class="node-title">Branches and remote sites</text>
  <text x="182" y="444" text-anchor="middle" class="node-text">SD-WAN, site-to-site VPN, and local networks</text>
  <rect x="45" y="504" width="275" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="182" y="540" text-anchor="middle" class="node-title">Remote users</text>
  <text x="182" y="566" text-anchor="middle" class="node-text">Approved point-to-site access and identity</text>
  <rect x="45" y="626" width="275" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="182" y="662" text-anchor="middle" class="node-title">Separate internet path</text>
  <text x="182" y="688" text-anchor="middle" class="node-text">Independent provider and VPN failover</text>

  <rect x="470" y="220" width="740" height="540" rx="22" fill="#ffffff" stroke="#7654c5" stroke-width="3"/>
  <text x="505" y="260" class="boundary-title">Azure connectivity plane</text>
  <text x="505" y="286" class="node-text">Network reachability and routing, not application integration logic</text>
  <rect x="505" y="315" width="310" height="145" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="660" y="354" text-anchor="middle" class="node-title">ExpressRoute</text>
  <text x="660" y="381" text-anchor="middle" class="node-text">Private provider-based primary path</text>
  <text x="660" y="404" text-anchor="middle" class="node-text">BGP, private peering, throughput, resiliency</text>
  <text x="660" y="427" text-anchor="middle" class="node-text">Independent circuits for critical recovery</text>
  <rect x="855" y="315" width="310" height="145" rx="16" fill="#fff5ed" stroke="#d06b2b" stroke-width="3"/>
  <text x="1010" y="354" text-anchor="middle" class="node-title">VPN Gateway</text>
  <text x="1010" y="381" text-anchor="middle" class="node-text">Encrypted site-to-site backup path</text>
  <text x="1010" y="404" text-anchor="middle" class="node-text">Point-to-site users and smaller sites</text>
  <text x="1010" y="427" text-anchor="middle" class="node-text">IPsec/IKE, BGP, gateway capacity</text>
  <rect x="505" y="515" width="310" height="120" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="660" y="553" text-anchor="middle" class="node-title">Virtual WAN hubs</text>
  <text x="660" y="580" text-anchor="middle" class="node-text">Managed transit and regional routing</text>
  <text x="660" y="603" text-anchor="middle" class="node-text">Branches, VNets, users, and inter-hub paths</text>
  <rect x="855" y="515" width="310" height="120" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="1010" y="553" text-anchor="middle" class="node-title">Route and security policy</text>
  <text x="1010" y="580" text-anchor="middle" class="node-text">Route tables, propagation, firewall, and NVA</text>
  <text x="1010" y="603" text-anchor="middle" class="node-text">Private DNS, inspection, and segmentation</text>
  <rect x="600" y="680" width="480" height="52" rx="26" fill="#ffffff" stroke="#b8c7d9"/>
  <text x="840" y="713" text-anchor="middle" class="label">Connectivity carries packets; identity and applications authorize actions</text>

  <text x="1300" y="238" class="boundary-title">Azure destinations</text>
  <rect x="1300" y="260" width="455" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="1527" y="296" text-anchor="middle" class="node-title">Production and non-production VNets</text>
  <text x="1527" y="322" text-anchor="middle" class="node-text">Landing zones with explicit route domains</text>
  <rect x="1300" y="382" width="455" height="92" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1527" y="418" text-anchor="middle" class="node-title">Shared services and private access</text>
  <text x="1527" y="444" text-anchor="middle" class="node-text">DNS, private endpoints, identity, and platform services</text>
  <rect x="1300" y="504" width="455" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="1527" y="540" text-anchor="middle" class="node-title">Inspection and controlled egress</text>
  <text x="1527" y="566" text-anchor="middle" class="node-text">Azure Firewall, NVA, and monitored service chains</text>
  <rect x="1300" y="626" width="455" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1527" y="662" text-anchor="middle" class="node-title">Application boundaries</text>
  <text x="1527" y="688" text-anchor="middle" class="node-text">APIs, brokers, workflows, and runtimes authorize work</text>

  <path d="M320 306 H455" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#primary-arrow)"/>
  <path d="M320 428 H455 V390 H845" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 550 H455 V390 H845" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 672 H455 V390 H845" stroke="#d06b2b" stroke-width="5" stroke-dasharray="12 8" fill="none" marker-end="url(#backup-arrow)"/>
  <path d="M815 387 H845" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#primary-arrow)"/>
  <path d="M1165 387 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V428 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V550 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V672 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M220 194 V215 H660 V305" stroke="#2878c8" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M600 194 V215 H1010 V305" stroke="#7654c5" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M980 194 V215 H1010 V505" stroke="#16849a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M1470 194 V215 H1110 V505" stroke="#d99a00" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>

  <text x="390" y="298" text-anchor="middle" class="label">primary</text>
  <text x="390" y="663" text-anchor="middle" class="label">separate backup</text>
  <text x="1215" y="372" text-anchor="middle" class="label">routed connectivity</text>
  <text x="900" y="850" text-anchor="middle" class="label">ExpressRoute for private primary · VPN Gateway for encrypted access and failover · Virtual WAN for managed transit</text>
</svg>
