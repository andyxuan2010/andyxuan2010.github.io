<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Hub-and-spoke and transit network topology</title>
  <desc id="desc">Two regional transit domains connect separate data centres over private circuits and controlled inter-region routes. Each transit domain provides inspection, DNS and shared connectivity, and routes to production or non-production spokes.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 18px Arial,sans-serif;fill:#15253d}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.label{font:700 13px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="650" fill="#f7f9fc"/>
  <text x="800" y="46" text-anchor="middle" class="title">Hub-and-spoke and transit topology</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Separate regional route domains with controlled private connectivity and spoke isolation</text>

  <rect x="55" y="220" width="220" height="82" rx="14" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="165" y="254" text-anchor="middle" class="node-title">Data centre A</text><text x="165" y="280" text-anchor="middle" class="node-text">Private circuit</text>
  <rect x="55" y="390" width="220" height="82" rx="14" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="165" y="424" text-anchor="middle" class="node-title">Data centre B</text><text x="165" y="450" text-anchor="middle" class="node-text">Private circuit</text>

  <rect x="370" y="185" width="280" height="150" rx="18" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="510" y="226" text-anchor="middle" class="node-title">Regional transit A</text><text x="510" y="255" text-anchor="middle" class="node-text">Route domain A</text><text x="510" y="282" text-anchor="middle" class="node-text">Inspection and DNS</text><text x="510" y="309" text-anchor="middle" class="node-text">Production and non-production spokes</text>
  <rect x="370" y="355" width="280" height="150" rx="18" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="510" y="396" text-anchor="middle" class="node-title">Regional transit B</text><text x="510" y="425" text-anchor="middle" class="node-text">Route domain B</text><text x="510" y="452" text-anchor="middle" class="node-text">Inspection and DNS</text><text x="510" y="479" text-anchor="middle" class="node-text">Production and recovery spokes</text>

  <rect x="800" y="145" width="230" height="78" rx="14" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="915" y="178" text-anchor="middle" class="node-title">Inspection domain A</text><text x="915" y="204" text-anchor="middle" class="node-text">Central security controls</text>
  <rect x="800" y="250" width="230" height="78" rx="14" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="915" y="283" text-anchor="middle" class="node-title">DNS and shared A</text><text x="915" y="309" text-anchor="middle" class="node-text">Shared connectivity</text>
  <rect x="800" y="355" width="230" height="78" rx="14" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="915" y="388" text-anchor="middle" class="node-title">Inspection domain B</text><text x="915" y="414" text-anchor="middle" class="node-text">Central security controls</text>
  <rect x="800" y="460" width="230" height="78" rx="14" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="915" y="493" text-anchor="middle" class="node-title">DNS and shared B</text><text x="915" y="519" text-anchor="middle" class="node-text">Shared connectivity</text>

  <rect x="1135" y="135" width="190" height="82" rx="14" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="1230" y="169" text-anchor="middle" class="node-title">Production spokes</text><text x="1230" y="195" text-anchor="middle" class="node-text">Transit A</text>
  <rect x="1135" y="240" width="190" height="82" rx="14" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="1230" y="274" text-anchor="middle" class="node-title">Non-production</text><text x="1230" y="300" text-anchor="middle" class="node-text">Transit A</text>
  <rect x="1135" y="390" width="190" height="82" rx="14" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="1230" y="424" text-anchor="middle" class="node-title">Production spokes</text><text x="1230" y="450" text-anchor="middle" class="node-text">Transit B</text>
  <rect x="1135" y="495" width="190" height="82" rx="14" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1230" y="529" text-anchor="middle" class="node-title">Recovery spokes</text><text x="1230" y="555" text-anchor="middle" class="node-text">Transit B</text>

  <path d="M275 261 H360 M275 431 H360" fill="none" stroke="#52667f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 260 H790 M650 430 H790" fill="none" stroke="#52667f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 260 C720 260 720 430 790 430 M650 430 C720 430 720 260 790 260" fill="none" stroke="#2878c8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="720" y="342" text-anchor="middle" class="label">Controlled inter-region routes</text>
  <path d="M650 260 H790 V184 M650 260 H790 V289 M650 430 H790 V394 M650 430 H790 V499" fill="none" stroke="#52667f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1030 184 H1125 M1030 289 H1125 M1030 394 H1125 M1030 499 H1125" fill="none" stroke="#52667f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="360" y="590" width="880" height="38" rx="19" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="615" text-anchor="middle" class="label">Private circuits are primary paths; route exchange and inspection remain explicitly controlled</text>
</svg>
