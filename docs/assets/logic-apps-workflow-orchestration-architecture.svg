<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow orchestration architecture with Azure Logic Apps</title>
  <desc id="desc">SAP, SFTP, APIs, Service Bus, partner endpoints, and schedules trigger Azure Logic Apps. The Logic Apps runtime uses connectors, control flow, state, retries, approvals, and B2B artifacts to coordinate SaaS, on-premises databases, and partner systems. Service Bus provides durable messaging, Functions provides custom code, and data platforms provide large analytical transformations. Microsoft Entra ID, Key Vault, private networking, deployment automation, and Azure Monitor govern the workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker>
    <marker id="control-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7654c5"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#15253d}
      .subtitle{font:400 17px Arial,sans-serif;fill:#52667f}
      .boundary-title{font:700 21px Arial,sans-serif;fill:#15253d}
      .node-title{font:700 18px Arial,sans-serif;fill:#15253d}
      .node-text{font:400 15px Arial,sans-serif;fill:#52667f}
      .label{font:700 14px Arial,sans-serif;fill:#52667f}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f7f9fc"/>
  <text x="900" y="48" text-anchor="middle" class="title">Workflow orchestration with Azure Logic Apps</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Use connector-driven control flow for enterprise processes while durable messages, custom code, and analytics remain separate</text>

  <rect x="45" y="112" width="350" height="82" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="220" y="147" text-anchor="middle" class="node-title">Microsoft Entra ID and Key Vault</text>
  <text x="220" y="173" text-anchor="middle" class="node-text">Identity, secrets, certificates, and access</text>
  <rect x="425" y="112" width="350" height="82" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="600" y="147" text-anchor="middle" class="node-title">CI/CD and infrastructure as code</text>
  <text x="600" y="173" text-anchor="middle" class="node-text">Definitions, parameters, artifacts, and rollback</text>
  <rect x="805" y="112" width="350" height="82" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="980" y="147" text-anchor="middle" class="node-title">Azure Monitor and operations</text>
  <text x="980" y="173" text-anchor="middle" class="node-text">Runs, dependencies, retries, and alerts</text>
  <rect x="1185" y="112" width="570" height="82" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1470" y="147" text-anchor="middle" class="node-title">Private networking and hybrid connectivity</text>
  <text x="1470" y="173" text-anchor="middle" class="node-text">VNet, private endpoints, gateway, DNS, and hybrid hosting</text>

  <text x="45" y="238" class="boundary-title">Triggers and inputs</text>
  <rect x="45" y="260" width="275" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="182" y="296" text-anchor="middle" class="node-title">SAP and enterprise systems</text>
  <text x="182" y="322" text-anchor="middle" class="node-text">Business events and transactions</text>
  <rect x="45" y="382" width="275" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="182" y="418" text-anchor="middle" class="node-title">SFTP and file arrival</text>
  <text x="182" y="444" text-anchor="middle" class="node-text">Files, schemas, quarantine, and archive</text>
  <rect x="45" y="504" width="275" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="182" y="540" text-anchor="middle" class="node-title">APIs, partners, and events</text>
  <text x="182" y="566" text-anchor="middle" class="node-text">HTTP, webhooks, Event Grid, and B2B</text>
  <rect x="45" y="626" width="275" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="182" y="662" text-anchor="middle" class="node-title">Service Bus and schedules</text>
  <text x="182" y="688" text-anchor="middle" class="node-text">Durable messages and timed processes</text>

  <rect x="470" y="220" width="740" height="540" rx="22" fill="#ffffff" stroke="#7654c5" stroke-width="3"/>
  <text x="505" y="260" class="boundary-title">Azure Logic Apps workflow boundary</text>
  <text x="505" y="286" class="node-text">Standard for private networking, multiple workflows, runtime control, or hybrid placement</text>
  <rect x="505" y="315" width="310" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="660" y="354" text-anchor="middle" class="node-title">Triggers and connectors</text>
  <text x="660" y="381" text-anchor="middle" class="node-text">SAP, SaaS, database, SFTP, API</text>
  <text x="660" y="404" text-anchor="middle" class="node-text">Service Bus and partner adapters</text>
  <text x="660" y="427" text-anchor="middle" class="node-text">Managed and built-in connections</text>
  <rect x="855" y="315" width="310" height="145" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1010" y="354" text-anchor="middle" class="node-title">Control flow</text>
  <text x="1010" y="381" text-anchor="middle" class="node-text">Conditions, loops, branches, and scopes</text>
  <text x="1010" y="404" text-anchor="middle" class="node-text">Approvals, notifications, and schedules</text>
  <text x="1010" y="427" text-anchor="middle" class="node-text">Bounded expressions and mapping</text>
  <rect x="505" y="515" width="310" height="120" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="660" y="553" text-anchor="middle" class="node-title">State and reliability</text>
  <text x="660" y="580" text-anchor="middle" class="node-text">Run history, retries, timeouts</text>
  <text x="660" y="603" text-anchor="middle" class="node-text">Idempotency, compensation, replay</text>
  <rect x="855" y="515" width="310" height="120" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="1010" y="553" text-anchor="middle" class="node-title">B2B and workflow artifacts</text>
  <text x="1010" y="580" text-anchor="middle" class="node-text">Partners, agreements, maps, schemas</text>
  <text x="1010" y="603" text-anchor="middle" class="node-text">EDI, X12, EDIFACT, AS2, certificates</text>
  <rect x="600" y="680" width="480" height="52" rx="26" fill="#ffffff" stroke="#b8c7d9"/>
  <text x="840" y="713" text-anchor="middle" class="label">Logic Apps orchestrates; it does not replace durable messaging or application runtime code</text>

  <text x="1300" y="238" class="boundary-title">Systems and handoff boundaries</text>
  <rect x="1300" y="260" width="455" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="1527" y="296" text-anchor="middle" class="node-title">SaaS, APIs, and enterprise systems</text>
  <text x="1527" y="322" text-anchor="middle" class="node-text">CRM, ERP, databases, and partner services</text>
  <rect x="1300" y="382" width="455" height="92" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1527" y="418" text-anchor="middle" class="node-title">Service Bus</text>
  <text x="1527" y="444" text-anchor="middle" class="node-text">Durable queues, topics, retries, and DLQs</text>
  <rect x="1300" y="504" width="455" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="1527" y="540" text-anchor="middle" class="node-title">Azure Functions and APIs</text>
  <text x="1527" y="566" text-anchor="middle" class="node-text">Custom code and governed service boundaries</text>
  <rect x="1300" y="626" width="455" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1527" y="662" text-anchor="middle" class="node-title">Data platforms</text>
  <text x="1527" y="688" text-anchor="middle" class="node-text">Large analytical movement and transformation</text>

  <path d="M320 306 H455" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 428 H455 V390 H490" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 550 H455 V390 H490" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 672 H455 V390 H490" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 387 H845" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V428 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V550 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V672 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M220 194 V215 H660 V305" stroke="#2878c8" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M600 194 V215 H1010 V305" stroke="#7654c5" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M980 194 V215 H1010 V505" stroke="#16849a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>
  <path d="M1470 194 V215 H1110 V505" stroke="#d99a00" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>

  <text x="390" y="298" text-anchor="middle" class="label">trigger</text>
  <text x="1215" y="372" text-anchor="middle" class="label">orchestrated result</text>
  <text x="900" y="850" text-anchor="middle" class="label">Use Service Bus for durability · Use Functions for custom code · Use data platforms for analytical transformation</text>
</svg>
