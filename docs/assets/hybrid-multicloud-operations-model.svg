<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid and multicloud federated operating model</title>
  <desc id="desc">A central operations platform owns inventory, telemetry, change, incident, and evidence capabilities. These capabilities coordinate Azure, AWS, GCP, OCI, and datacentre operations, while service owners remain accountable for service objectives and runbooks.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 18px Arial,sans-serif;fill:#15253d}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}.group{font:700 16px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="760" fill="#f7f9fc"/>
  <text x="800" y="46" text-anchor="middle" class="title">Federated hybrid and multicloud operations</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Centralize common operational data and coordination while retaining provider-specific execution ownership</text>

  <rect x="80" y="125" width="410" height="120" rx="18" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="285" y="168" text-anchor="middle" class="node-title">Central operations platform</text><text x="285" y="198" text-anchor="middle" class="node-text">Common data model, routing, policy, coordination</text><text x="285" y="222" text-anchor="middle" class="node-text">Cross-environment control plane</text>
  <rect x="1110" y="125" width="410" height="120" rx="18" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="1315" y="168" text-anchor="middle" class="node-title">Service owners</text><text x="1315" y="198" text-anchor="middle" class="node-text">Service objectives</text><text x="1315" y="222" text-anchor="middle" class="node-text">Runbooks and outcomes</text>

  <rect x="35" y="315" width="270" height="88" rx="15" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="170" y="350" text-anchor="middle" class="node-title">Inventory and ownership</text><text x="170" y="377" text-anchor="middle" class="node-text">Resources and accountability</text>
  <rect x="335" y="315" width="270" height="88" rx="15" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="470" y="350" text-anchor="middle" class="node-title">Telemetry and correlation</text><text x="470" y="377" text-anchor="middle" class="node-text">Signals and event context</text>
  <rect x="635" y="315" width="270" height="88" rx="15" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="770" y="350" text-anchor="middle" class="node-title">Change and automation</text><text x="770" y="377" text-anchor="middle" class="node-text">Patch and workflow control</text>
  <rect x="935" y="315" width="270" height="88" rx="15" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="1070" y="350" text-anchor="middle" class="node-title">Incident and problem</text><text x="1070" y="377" text-anchor="middle" class="node-text">Response and learning</text>
  <rect x="1235" y="315" width="330" height="88" rx="15" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1400" y="350" text-anchor="middle" class="node-title">Compliance, cost, and audit</text><text x="1400" y="377" text-anchor="middle" class="node-text">Evidence and reporting</text>
  <path d="M285 245 V290 H170 V305 M285 290 H470 V305 M285 290 H770 V305 M285 290 H1070 V305 M285 290 H1400 V305" fill="none" stroke="#52667f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="465" width="1490" height="205" rx="20" fill="#ffffff" stroke="#b8c7d9" stroke-width="3" stroke-dasharray="10 8"/><text x="800" y="495" text-anchor="middle" class="group">Provider and site operations</text>
  <rect x="90" y="525" width="240" height="88" rx="14" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="210" y="559" text-anchor="middle" class="node-title">Azure operations</text><text x="210" y="586" text-anchor="middle" class="node-text">Provider controls</text>
  <rect x="380" y="525" width="240" height="88" rx="14" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="500" y="559" text-anchor="middle" class="node-title">AWS operations</text><text x="500" y="586" text-anchor="middle" class="node-text">Provider controls</text>
  <rect x="670" y="525" width="240" height="88" rx="14" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="790" y="559" text-anchor="middle" class="node-title">GCP operations</text><text x="790" y="586" text-anchor="middle" class="node-text">Provider controls</text>
  <rect x="960" y="525" width="240" height="88" rx="14" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1080" y="559" text-anchor="middle" class="node-title">OCI operations</text><text x="1080" y="586" text-anchor="middle" class="node-text">Provider controls</text>
  <rect x="1250" y="525" width="240" height="88" rx="14" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="1370" y="559" text-anchor="middle" class="node-title">Datacentre and edge</text><text x="1370" y="586" text-anchor="middle" class="node-text">Local execution</text>
  <path d="M170 403 V515 M470 403 V515 M770 403 V515 M1070 403 V515 M1400 403 V515" fill="none" stroke="#52667f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1490 525 C1490 430 1460 300 1315 245" fill="none" stroke="#2e8b57" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="390" y="700" width="820" height="38" rx="19" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="725" text-anchor="middle" class="label">Central coordination does not remove local provider ownership of quotas, maintenance, and recovery execution</text>
</svg>
