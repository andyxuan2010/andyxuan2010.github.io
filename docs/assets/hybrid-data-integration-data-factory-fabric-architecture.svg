<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid data integration architecture with Azure Data Factory and Fabric Data Factory</title>
  <desc id="desc">On-premises SQL, Oracle, file shares, SFTP, cloud stores, SaaS systems, and APIs feed Azure Data Factory or Fabric Data Factory pipelines. A self-hosted integration runtime provides the private execution bridge. Pipelines orchestrate Copy, Dataflows, Databricks, Spark, SQL, notebooks, and other transformations into data lakes, lakehouses, warehouses, and analytics. Monitoring, identity, Key Vault, private networking, schemas, and quality controls govern the platform.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker>
    <marker id="data-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#16849a"/></marker>
    <marker id="control-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7654c5"/></marker>
    <marker id="private-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#d99a00"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#15253d}
      .subtitle{font:400 17px Arial,sans-serif;fill:#52667f}
      .boundary-title{font:700 21px Arial,sans-serif;fill:#15253d}
      .node-title{font:700 18px Arial,sans-serif;fill:#15253d}
      .node-text{font:400 15px Arial,sans-serif;fill:#52667f}
      .label{font:700 14px Arial,sans-serif;fill:#52667f}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f7f9fc"/>
  <text x="900" y="48" text-anchor="middle" class="title">Hybrid data integration with Data Factory</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Move and transform data across private sources, cloud targets, lakes, warehouses, and compute engines</text>

  <rect x="45" y="112" width="350" height="82" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="220" y="147" text-anchor="middle" class="node-title">Microsoft Entra ID and Key Vault</text>
  <text x="220" y="173" text-anchor="middle" class="node-text">Authoring, runtime, source, target, and secrets</text>
  <rect x="425" y="112" width="350" height="82" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="600" y="147" text-anchor="middle" class="node-title">CI/CD and data governance</text>
  <text x="600" y="173" text-anchor="middle" class="node-text">Pipelines, schemas, lineage, quality, and rollback</text>
  <rect x="805" y="112" width="350" height="82" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="980" y="147" text-anchor="middle" class="node-title">Azure Monitor and Fabric monitoring</text>
  <text x="980" y="173" text-anchor="middle" class="node-text">Runs, freshness, quality, runtime, and capacity</text>
  <rect x="1185" y="112" width="570" height="82" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1470" y="147" text-anchor="middle" class="node-title">Private networking and data contracts</text>
  <text x="1470" y="173" text-anchor="middle" class="node-text">Private endpoints, DNS, IPAM, schemas, retention, and classification</text>

  <text x="45" y="238" class="boundary-title">Sources and private data</text>
  <rect x="45" y="260" width="275" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="182" y="296" text-anchor="middle" class="node-title">On-premises SQL and Oracle</text>
  <text x="182" y="322" text-anchor="middle" class="node-text">Full, incremental, CDC, and reconciliation</text>
  <rect x="45" y="382" width="275" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="182" y="418" text-anchor="middle" class="node-title">File shares and SFTP</text>
  <text x="182" y="444" text-anchor="middle" class="node-text">Completion markers, manifests, and quarantine</text>
  <rect x="45" y="504" width="275" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="182" y="540" text-anchor="middle" class="node-title">Cloud stores and SaaS</text>
  <text x="182" y="566" text-anchor="middle" class="node-text">APIs, databases, objects, and applications</text>
  <rect x="45" y="626" width="275" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="182" y="662" text-anchor="middle" class="node-title">Schedules and dependencies</text>
  <text x="182" y="688" text-anchor="middle" class="node-text">Windows, events, watermarks, and controls</text>

  <rect x="470" y="220" width="740" height="540" rx="22" fill="#ffffff" stroke="#7654c5" stroke-width="3"/>
  <text x="505" y="260" class="boundary-title">Data Factory orchestration boundary</text>
  <text x="505" y="286" class="node-text">Fabric Data Factory for greenfield alignment; Azure Data Factory for fit-for-purpose existing estates</text>
  <rect x="505" y="315" width="310" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="660" y="354" text-anchor="middle" class="node-title">Pipelines and triggers</text>
  <text x="660" y="381" text-anchor="middle" class="node-text">Schedules, dependencies, parameters, and retries</text>
  <text x="660" y="404" text-anchor="middle" class="node-text">Copy, dataflow, notebook, and job activities</text>
  <text x="660" y="427" text-anchor="middle" class="node-text">Watermarks, quality, quarantine, and publish</text>
  <rect x="855" y="315" width="310" height="145" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="1010" y="354" text-anchor="middle" class="node-title">Integration runtimes</text>
  <text x="1010" y="381" text-anchor="middle" class="node-text">Azure, managed VNet, or self-hosted IR</text>
  <text x="1010" y="404" text-anchor="middle" class="node-text">Private source bridge and connector execution</text>
  <text x="1010" y="427" text-anchor="middle" class="node-text">Nodes, drivers, capacity, and patching</text>
  <rect x="505" y="515" width="310" height="120" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="660" y="553" text-anchor="middle" class="node-title">Data movement</text>
  <text x="660" y="580" text-anchor="middle" class="node-text">Full, incremental, CDC, batch, and file loads</text>
  <text x="660" y="603" text-anchor="middle" class="node-text">Staging, control totals, and idempotency</text>
  <rect x="855" y="515" width="310" height="120" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1010" y="553" text-anchor="middle" class="node-title">Transformation engines</text>
  <text x="1010" y="580" text-anchor="middle" class="node-text">Databricks, Spark, SQL, Dataflows, and notebooks</text>
  <text x="1010" y="603" text-anchor="middle" class="node-text">Engine-owned code and compute capacity</text>
  <rect x="600" y="680" width="480" height="52" rx="26" fill="#ffffff" stroke="#b8c7d9"/>
  <text x="840" y="713" text-anchor="middle" class="label">Data Factory orchestrates movement and compute; it is not a business workflow runtime</text>

  <text x="1300" y="238" class="boundary-title">Targets and data products</text>
  <rect x="1300" y="260" width="455" height="92" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1527" y="296" text-anchor="middle" class="node-title">Raw and curated data lake</text>
  <text x="1527" y="322" text-anchor="middle" class="node-text">Bronze, silver, gold, retention, and replay</text>
  <rect x="1300" y="382" width="455" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="1527" y="418" text-anchor="middle" class="node-title">Fabric lakehouse and warehouse</text>
  <text x="1527" y="444" text-anchor="middle" class="node-text">OneLake, SQL, semantic models, and reporting</text>
  <rect x="1300" y="504" width="455" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="1527" y="540" text-anchor="middle" class="node-title">Analytical and operational stores</text>
  <text x="1527" y="566" text-anchor="middle" class="node-text">Synapse, Azure SQL, Data Explorer, and data products</text>
  <rect x="1300" y="626" width="455" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1527" y="662" text-anchor="middle" class="node-title">Quality, lineage, and consumers</text>
  <text x="1527" y="688" text-anchor="middle" class="node-text">Freshness, reconciliation, governance, and analytics</text>

  <path d="M320 306 H455" stroke="#d99a00" stroke-width="4" fill="none" marker-end="url(#private-arrow)"/>
  <path d="M320 428 H455 V390 H845" stroke="#d99a00" stroke-width="4" fill="none" marker-end="url(#private-arrow)"/>
  <path d="M320 550 H455 V390 H490" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#data-arrow)"/>
  <path d="M320 672 H455 V390 H490" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 387 H845" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#data-arrow)"/>
  <path d="M1165 387 H1280" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V428 H1280" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V550 H1280" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V672 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 575 H1235 V550 H1280" stroke="#2e8b57" stroke-width="5" stroke-dasharray="12 8" fill="none" marker-end="url(#arrow)"/>
  <path d="M220 194 V215 H1010 V305" stroke="#2878c8" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M600 194 V215 H660 V305" stroke="#7654c5" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M980 194 V215 H1010 V505" stroke="#16849a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M1470 194 V215 H1110 V505" stroke="#d99a00" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>

  <text x="390" y="298" text-anchor="middle" class="label">ingest</text>
  <text x="1215" y="372" text-anchor="middle" class="label">publish</text>
  <text x="1215" y="540" text-anchor="middle" class="label">transform</text>
  <text x="900" y="850" text-anchor="middle" class="label">Use self-hosted IR for private sources · Use pipelines for movement and dependencies · Use engines for transformation</text>
</svg>
