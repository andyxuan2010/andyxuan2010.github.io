<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Real-time streaming architecture with Azure Event Hubs</title>
  <desc id="desc">IoT devices, applications, security tools, clickstream producers, financial market feeds, and Kafka clients publish high-volume events to Azure Event Hubs. Event hubs provide partitioned append-only streams. Independent consumer groups read offsets for real-time analytics, Functions, Data Explorer, and operational systems. Event Hubs Capture writes a cold path to Blob Storage or Data Lake Storage. Service Bus handles durable business work and Event Grid handles discrete state-change notifications.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker>
    <marker id="stream-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#16849a"/></marker>
    <marker id="work-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2e8b57"/></marker>
    <marker id="control-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#7654c5"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#15253d}
      .subtitle{font:400 17px Arial,sans-serif;fill:#52667f}
      .boundary-title{font:700 21px Arial,sans-serif;fill:#15253d}
      .node-title{font:700 18px Arial,sans-serif;fill:#15253d}
      .node-text{font:400 15px Arial,sans-serif;fill:#52667f}
      .label{font:700 14px Arial,sans-serif;fill:#52667f}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f7f9fc"/>
  <text x="900" y="48" text-anchor="middle" class="title">Real-time streaming with Azure Event Hubs</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Partitioned append-only streams · independent consumer groups · real-time and cold-path analytics</text>

  <rect x="45" y="112" width="350" height="82" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="220" y="147" text-anchor="middle" class="node-title">Microsoft Entra ID and Key Vault</text>
  <text x="220" y="173" text-anchor="middle" class="node-text">Producer, consumer, storage, and replay access</text>
  <rect x="425" y="112" width="350" height="82" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="600" y="147" text-anchor="middle" class="node-title">CI/CD and stream governance</text>
  <text x="600" y="173" text-anchor="middle" class="node-text">Schemas, partitions, consumer groups, and rollout</text>
  <rect x="805" y="112" width="350" height="82" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="980" y="147" text-anchor="middle" class="node-title">Azure Monitor and operations</text>
  <text x="980" y="173" text-anchor="middle" class="node-text">Throughput, lag, checkpoints, replay, and errors</text>
  <rect x="1185" y="112" width="570" height="82" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1470" y="147" text-anchor="middle" class="node-title">Private networking and data governance</text>
  <text x="1470" y="173" text-anchor="middle" class="node-text">Private endpoints, DNS, encryption, schema, and retention</text>

  <text x="45" y="238" class="boundary-title">High-volume producers</text>
  <rect x="45" y="260" width="275" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="182" y="296" text-anchor="middle" class="node-title">IoT and device telemetry</text>
  <text x="182" y="322" text-anchor="middle" class="node-text">Sensors, gateways, vehicles, and machines</text>
  <rect x="45" y="382" width="275" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="182" y="418" text-anchor="middle" class="node-title">Application and security logs</text>
  <text x="182" y="444" text-anchor="middle" class="node-text">Services, networks, audit, and detections</text>
  <rect x="45" y="504" width="275" height="92" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="182" y="540" text-anchor="middle" class="node-title">Clickstreams and market data</text>
  <text x="182" y="566" text-anchor="middle" class="node-text">User behavior, prices, and trading signals</text>
  <rect x="45" y="626" width="275" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="182" y="662" text-anchor="middle" class="node-title">Kafka, AMQP, and HTTPS clients</text>
  <text x="182" y="688" text-anchor="middle" class="node-text">Managed protocol-compatible ingestion</text>

  <rect x="470" y="220" width="740" height="540" rx="22" fill="#ffffff" stroke="#7654c5" stroke-width="3"/>
  <text x="505" y="260" class="boundary-title">Azure Event Hubs streaming boundary</text>
  <text x="505" y="286" class="node-text">Append-oriented stream, not a transactional enterprise work queue</text>
  <rect x="505" y="315" width="310" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="660" y="354" text-anchor="middle" class="node-title">Namespace and event hubs</text>
  <text x="660" y="381" text-anchor="middle" class="node-text">AMQP 1.0, Kafka, and HTTPS protocols</text>
  <text x="660" y="404" text-anchor="middle" class="node-text">Capacity, network, identity, and retention</text>
  <text x="660" y="427" text-anchor="middle" class="node-text">Batching, backpressure, and ingress control</text>
  <rect x="855" y="315" width="310" height="145" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="1010" y="354" text-anchor="middle" class="node-title">Partitions and ordering</text>
  <text x="1010" y="381" text-anchor="middle" class="node-text">Stable key preserves per-key order</text>
  <text x="1010" y="404" text-anchor="middle" class="node-text">Independent lanes scale throughput</text>
  <text x="1010" y="427" text-anchor="middle" class="node-text">No global ordering across partitions</text>
  <rect x="505" y="515" width="310" height="120" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/>
  <text x="660" y="553" text-anchor="middle" class="node-title">Consumer groups and offsets</text>
  <text x="660" y="580" text-anchor="middle" class="node-text">Independent cursors and checkpoints</text>
  <text x="660" y="603" text-anchor="middle" class="node-text">At-least-once processing and replay</text>
  <rect x="855" y="515" width="310" height="120" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1010" y="553" text-anchor="middle" class="node-title">Capture and retention</text>
  <text x="1010" y="580" text-anchor="middle" class="node-text">Hot retention for stream consumers</text>
  <text x="1010" y="603" text-anchor="middle" class="node-text">Blob or Data Lake cold path for history</text>
  <rect x="600" y="680" width="480" height="52" rx="26" fill="#ffffff" stroke="#b8c7d9"/>
  <text x="840" y="713" text-anchor="middle" class="label">Event Hubs streams data; consumers own processing and checkpoints</text>

  <text x="1300" y="238" class="boundary-title">Consumers and service boundaries</text>
  <rect x="1300" y="260" width="455" height="92" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/>
  <text x="1527" y="296" text-anchor="middle" class="node-title">Stream Analytics and Data Explorer</text>
  <text x="1527" y="322" text-anchor="middle" class="node-text">Windows, aggregates, alerts, and exploration</text>
  <rect x="1300" y="382" width="455" height="92" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/>
  <text x="1527" y="418" text-anchor="middle" class="node-title">Functions, Spark, Flink, and Fabric</text>
  <text x="1527" y="444" text-anchor="middle" class="node-text">Custom processing, features, and data products</text>
  <rect x="1300" y="504" width="455" height="92" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/>
  <text x="1527" y="540" text-anchor="middle" class="node-title">Blob and Data Lake Storage</text>
  <text x="1527" y="566" text-anchor="middle" class="node-text">Capture, retention, replay, and batch analytics</text>
  <rect x="1300" y="626" width="455" height="92" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/>
  <text x="1527" y="662" text-anchor="middle" class="node-title">Service Bus and Event Grid</text>
  <text x="1527" y="688" text-anchor="middle" class="node-text">Durable business work and discrete notifications</text>

  <path d="M320 306 H455" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#stream-arrow)"/>
  <path d="M320 428 H455 V390 H490" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#stream-arrow)"/>
  <path d="M320 550 H455 V390 H490" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#stream-arrow)"/>
  <path d="M320 672 H455 V390 H490" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#stream-arrow)"/>
  <path d="M815 387 H845" stroke="#16849a" stroke-width="4" fill="none" marker-end="url(#stream-arrow)"/>
  <path d="M1165 387 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V428 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1165 387 H1235 V550 H1280" stroke="#2e8b57" stroke-width="5" fill="none" marker-end="url(#work-arrow)"/>
  <path d="M1165 387 H1235 V672 H1280" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 575 H1235 V550 H1280" stroke="#2e8b57" stroke-width="5" stroke-dasharray="12 8" fill="none" marker-end="url(#work-arrow)"/>
  <path d="M220 194 V215 H660 V305" stroke="#2878c8" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M600 194 V215 H1010 V305" stroke="#7654c5" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M980 194 V215 H1010 V505" stroke="#16849a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>
  <path d="M1470 194 V215 H1110 V505" stroke="#d99a00" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#control-arrow)"/>

  <text x="390" y="298" text-anchor="middle" class="label">ingest</text>
  <text x="1215" y="372" text-anchor="middle" class="label">stream read</text>
  <text x="1215" y="540" text-anchor="middle" class="label">capture</text>
  <text x="1215" y="660" text-anchor="middle" class="label">service boundary</text>
  <text x="900" y="850" text-anchor="middle" class="label">Use Event Hubs for streams · Use Service Bus for reliable work queues · Use Event Grid for discrete notifications</text>
</svg>
