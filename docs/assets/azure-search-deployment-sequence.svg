<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Azure Search demo deployment sequence</title>
  <desc id="desc">The azd up deployment creates Azure resources and the search index before the application is run locally.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 20px Arial,sans-serif;fill:#15253d}.node-text{font:400 16px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#b23b3b}</style></defs>
  <rect width="1600" height="500" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Azure deployment before local execution</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">The local application consumes the active azd environment after cloud resources exist</text>
  <rect x="145" y="155" width="340" height="150" rx="18" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="315" y="212" text-anchor="middle" class="node-title">azd up</text><text x="315" y="246" text-anchor="middle" class="node-text">Provision and configure</text><text x="315" y="271" text-anchor="middle" class="node-text">the active environment</text>
  <rect x="630" y="155" width="340" height="150" rx="18" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="800" y="212" text-anchor="middle" class="node-title">Azure resources and</text><text x="800" y="238" text-anchor="middle" class="node-title">search index exist</text><text x="800" y="271" text-anchor="middle" class="node-text">Endpoints, names, and identity are ready</text>
  <rect x="1115" y="155" width="340" height="150" rx="18" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1285" y="212" text-anchor="middle" class="node-title">Run app locally</text><text x="1285" y="246" text-anchor="middle" class="node-text">Use deployed names and</text><text x="1285" y="271" text-anchor="middle" class="node-text">endpoints for validation</text>
  <path d="M485 230 H620 M970 230 H1105" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="310" y="385" width="980" height="52" rx="26" fill="#fff8f7" stroke="#d99a00"/><text x="800" y="418" text-anchor="middle" class="label">Starting locally before azd up is not a valid baseline workflow.</text>
</svg>
