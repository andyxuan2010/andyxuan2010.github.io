<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Authorized retrieval and generation flow</title>
  <desc id="desc">A user is authenticated, entitlements are computed, retrieval is filtered, authorized chunks are reranked, and only then is an answer generated.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2e8b57"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#183d2a}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 18px Arial,sans-serif;fill:#183d2a}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#2e8b57}</style></defs>
  <rect width="1600" height="500" fill="#f7fbf8"/>
  <text x="800" y="52" text-anchor="middle" class="title">Correct pattern: authorize before generation</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Every retrieval step carries the user, tenant, and entitlement boundary</text>
  <rect x="45" y="150" width="250" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="170" y="205" text-anchor="middle" class="node-title">Authenticate</text><text x="170" y="237" text-anchor="middle" class="node-text">User and tenant identity</text><text x="170" y="262" text-anchor="middle" class="node-text">are verified</text>
  <rect x="355" y="150" width="250" height="145" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="480" y="205" text-anchor="middle" class="node-title">Compute entitlements</text><text x="480" y="237" text-anchor="middle" class="node-text">Roles, groups, and</text><text x="480" y="262" text-anchor="middle" class="node-text">tenant policy</text>
  <rect x="665" y="150" width="250" height="145" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="790" y="205" text-anchor="middle" class="node-title">Filter retrieval</text><text x="790" y="237" text-anchor="middle" class="node-text">Document and chunk</text><text x="790" y="262" text-anchor="middle" class="node-text">authorization filters</text>
  <rect x="975" y="150" width="250" height="145" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="1100" y="205" text-anchor="middle" class="node-title">Rerank authorized chunks</text><text x="1100" y="237" text-anchor="middle" class="node-text">Only permitted evidence</text><text x="1100" y="262" text-anchor="middle" class="node-text">enters final context</text>
  <rect x="1285" y="150" width="270" height="145" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1420" y="205" text-anchor="middle" class="node-title">Generate</text><text x="1420" y="237" text-anchor="middle" class="node-text">Answer with citations</text><text x="1420" y="262" text-anchor="middle" class="node-text">from authorized evidence</text>
  <path d="M295 222 H345 M605 222 H655 M915 222 H965 M1225 222 H1275" stroke="#2e8b57" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="290" y="380" width="1020" height="52" rx="26" fill="#ffffff" stroke="#9ec9ad"/><text x="800" y="413" text-anchor="middle" class="label">Include tenant identity in index keys, cache keys, traces, and retrieval filters</text>
</svg>
