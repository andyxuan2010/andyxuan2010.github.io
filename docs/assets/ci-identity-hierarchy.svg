<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD identity hierarchy</title>
  <desc id="desc">A deployment identity is narrowed from organization to repository, workflow, environment, and finally the role or service account.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 20px Arial,sans-serif;fill:#15253d}.node-text{font:400 16px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="620" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">CI/CD identity hierarchy</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Production roles should be assumable only from the production deployment job</text>
  <path d="M800 150 V535" stroke="#52667f" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="480" y="115" width="640" height="72" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="800" y="159" text-anchor="middle" class="node-title">Organization</text>
  <rect x="480" y="205" width="640" height="72" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="800" y="249" text-anchor="middle" class="node-title">Repository or Azure DevOps project</text>
  <rect x="480" y="295" width="640" height="72" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="800" y="339" text-anchor="middle" class="node-title">Workflow or pipeline</text>
  <rect x="480" y="385" width="640" height="72" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="800" y="429" text-anchor="middle" class="node-title">Environment</text>
  <rect x="480" y="475" width="640" height="72" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="800" y="519" text-anchor="middle" class="node-title">Role or service account</text>
  <text x="270" y="337" text-anchor="middle" class="label">Narrower trust scope</text><path d="M350 337 H465" stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1330" y="429" text-anchor="middle" class="label">Least privilege</text><path d="M1135 429 H1240" stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 6"/>
</svg>
