<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise address pool by cloud provider</title>
  <desc id="desc">An enterprise address pool is allocated to Azure, AWS, GCP, and OCI regional transit and workload boundaries with reserved growth space.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 20px Arial,sans-serif;fill:#15253d}.node-text{font:400 16px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="560" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Enterprise address pool</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Reserve non-overlapping ranges before cloud and environment allocation</text>
  <rect x="570" y="125" width="460" height="100" rx="18" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="800" y="171" text-anchor="middle" class="node-title">Enterprise address pool</text><text x="800" y="199" text-anchor="middle" class="node-text">Owner, region, purpose, growth, retirement</text>
  <path d="M800 225 V275 M800 275 H220 V325 M800 275 H680 V325 M800 275 H1140 V325 M800 275 H1460 V325" fill="none" stroke="#52667f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="325" width="300" height="120" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="220" y="370" text-anchor="middle" class="node-title">Azure</text><text x="220" y="400" text-anchor="middle" class="node-text">Region A/B transit</text><text x="220" y="423" text-anchor="middle" class="node-text">Production and non-production</text>
  <rect x="530" y="325" width="300" height="120" rx="16" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="680" y="370" text-anchor="middle" class="node-title">AWS</text><text x="680" y="400" text-anchor="middle" class="node-text">Regional VPC ranges</text><text x="680" y="423" text-anchor="middle" class="node-text">Transit and workload zones</text>
  <rect x="990" y="325" width="300" height="120" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1140" y="370" text-anchor="middle" class="node-title">GCP</text><text x="1140" y="400" text-anchor="middle" class="node-text">VPC network ranges</text><text x="1140" y="423" text-anchor="middle" class="node-text">Shared and service projects</text>
  <rect x="1370" y="325" width="180" height="120" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1460" y="370" text-anchor="middle" class="node-title">OCI</text><text x="1460" y="400" text-anchor="middle" class="node-text">VCN ranges</text><text x="1460" y="423" text-anchor="middle" class="node-text">Compartments</text>
  <rect x="310" y="485" width="980" height="44" rx="22" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="513" text-anchor="middle" class="label">Reject overlap · reserve growth space · retire only after route, DNS, and security dependencies are removed</text>
</svg>
