<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD environment promotion chain</title>
  <desc id="desc">A pull request moves through ephemeral or development, integration, staging, and production environments with isolation and explicit promotion controls.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 19px Arial,sans-serif;fill:#15253d}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.arrow{stroke:#52667f;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="520" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">CI/CD environment promotion chain</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Use only the environments needed for isolation, promotion, and representative testing</text>
  <rect x="45" y="150" width="230" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="160" y="205" text-anchor="middle" class="node-title">Pull request</text><text x="160" y="237" text-anchor="middle" class="node-text">Review, lint, policy</text><text x="160" y="262" text-anchor="middle" class="node-text">and speculative plan</text>
  <rect x="345" y="150" width="250" height="145" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="470" y="205" text-anchor="middle" class="node-title">Ephemeral / dev</text><text x="470" y="237" text-anchor="middle" class="node-text">Fast feedback with</text><text x="470" y="262" text-anchor="middle" class="node-text">isolated state</text>
  <rect x="665" y="150" width="220" height="145" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="775" y="205" text-anchor="middle" class="node-title">Integration</text><text x="775" y="237" text-anchor="middle" class="node-text">Cross-service tests</text><text x="775" y="262" text-anchor="middle" class="node-text">and evidence</text>
  <rect x="955" y="150" width="220" height="145" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="1065" y="205" text-anchor="middle" class="node-title">Staging</text><text x="1065" y="237" text-anchor="middle" class="node-text">Production-like</text><text x="1065" y="262" text-anchor="middle" class="node-text">release rehearsal</text>
  <rect x="1245" y="150" width="270" height="145" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1380" y="205" text-anchor="middle" class="node-title">Production</text><text x="1380" y="237" text-anchor="middle" class="node-text">Protected approval,</text><text x="1380" y="262" text-anchor="middle" class="node-text">rollout, and recovery</text>
  <path d="M275 222 H335 M595 222 H655 M885 222 H945 M1175 222 H1235" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="245" y="385" width="1110" height="58" rx="29" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="421" text-anchor="middle" class="node-text">Isolation boundaries + explicit promotion + representative tests</text>
</svg>
