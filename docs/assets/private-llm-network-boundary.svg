<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Private network boundary for an on-premises model server</title>
  <desc id="desc">A client subnet reaches an internal gateway through a firewall, then an authenticated upstream and a private model server.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 19px Arial,sans-serif;fill:#15253d}.node-text{font:400 15px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="520" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Private model-serving network boundary</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Expose an authenticated service path, never the model server directly</text>
  <rect x="55" y="150" width="240" height="145" rx="16" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="175" y="205" text-anchor="middle" class="node-title">Client subnet</text><text x="175" y="237" text-anchor="middle" class="node-text">Approved callers</text><text x="175" y="262" text-anchor="middle" class="node-text">Private routes only</text>
  <rect x="365" y="150" width="220" height="145" rx="16" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="475" y="205" text-anchor="middle" class="node-title">Firewall</text><text x="475" y="237" text-anchor="middle" class="node-text">Egress inspection</text><text x="475" y="262" text-anchor="middle" class="node-text">Allowlisted ports</text>
  <rect x="655" y="150" width="260" height="145" rx="16" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="785" y="205" text-anchor="middle" class="node-title">Internal gateway</text><text x="785" y="237" text-anchor="middle" class="node-text">TLS termination</text><text x="785" y="262" text-anchor="middle" class="node-text">Rate and route controls</text>
  <rect x="985" y="150" width="260" height="145" rx="16" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="1115" y="205" text-anchor="middle" class="node-title">Authenticated upstream</text><text x="1115" y="237" text-anchor="middle" class="node-text">Identity or service token</text><text x="1115" y="262" text-anchor="middle" class="node-text">Model authorization</text>
  <rect x="1315" y="150" width="230" height="145" rx="16" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1430" y="205" text-anchor="middle" class="node-title">Model server</text><text x="1430" y="237" text-anchor="middle" class="node-text">Local or private bind</text><text x="1430" y="262" text-anchor="middle" class="node-text">No public listener</text>
  <path d="M295 222 H355 M585 222 H645 M915 222 H975 M1245 222 H1305" stroke="#52667f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="235" y="380" width="1130" height="58" rx="29" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="416" text-anchor="middle" class="label">TLS · authentication · authorization · quota · redaction · correlation ID · audit trail</text>
</svg>
