<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Subscription and account vending workflow</title>
  <desc id="desc">A durable request moves from received through validation, approval, boundary creation, baseline application, acceptance testing, and active state.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#52667f"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#15253d}.subtitle{font:400 17px Arial,sans-serif;fill:#52667f}.node-title{font:700 16px Arial,sans-serif;fill:#15253d}.node-text{font:400 14px Arial,sans-serif;fill:#52667f}.label{font:700 14px Arial,sans-serif;fill:#52667f}</style></defs>
  <rect width="1600" height="520" fill="#f7f9fc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Subscription and account vending workflow</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Persist step-level state so retries reconcile instead of creating duplicate boundaries</text>
  <g transform="translate(48 155)">
    <rect width="190" height="125" rx="15" fill="#eef5ff" stroke="#2878c8" stroke-width="3"/><text x="95" y="58" text-anchor="middle" class="node-title">Received</text><text x="95" y="84" text-anchor="middle" class="node-text">Idempotency key</text>
    <rect x="225" width="190" height="125" rx="15" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="320" y="58" text-anchor="middle" class="node-title">Validated</text><text x="320" y="84" text-anchor="middle" class="node-text">Schema and policy</text>
    <rect x="450" width="190" height="125" rx="15" fill="#fff8e8" stroke="#d99a00" stroke-width="3"/><text x="545" y="58" text-anchor="middle" class="node-title">Approved</text><text x="545" y="84" text-anchor="middle" class="node-text">Risk-based decision</text>
    <rect x="675" width="190" height="125" rx="15" fill="#eef8f1" stroke="#2e8b57" stroke-width="3"/><text x="770" y="58" text-anchor="middle" class="node-title">Boundary created</text><text x="770" y="84" text-anchor="middle" class="node-text">Account or subscription</text>
    <rect x="900" width="190" height="125" rx="15" fill="#f4efff" stroke="#7654c5" stroke-width="3"/><text x="995" y="58" text-anchor="middle" class="node-title">Baseline applying</text><text x="995" y="84" text-anchor="middle" class="node-text">Guardrails and services</text>
    <rect x="1125" width="190" height="125" rx="15" fill="#fff3e8" stroke="#c55a11" stroke-width="3"/><text x="1220" y="58" text-anchor="middle" class="node-title">Acceptance test</text><text x="1220" y="84" text-anchor="middle" class="node-text">Effective controls</text>
    <rect x="1350" width="150" height="125" rx="15" fill="#edf8fb" stroke="#16849a" stroke-width="3"/><text x="1425" y="58" text-anchor="middle" class="node-title">Active</text><text x="1425" y="84" text-anchor="middle" class="node-text">Registry output</text>
    <path d="M190 62 H215 M415 62 H440 M640 62 H665 M865 62 H890 M1090 62 H1115 M1315 62 H1340" stroke="#52667f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>
  <rect x="310" y="375" width="980" height="58" rx="29" fill="#ffffff" stroke="#b8c7d9"/><text x="800" y="411" text-anchor="middle" class="label">Failure substates: retry · compensate · manual decision · quarantine</text>
</svg>
